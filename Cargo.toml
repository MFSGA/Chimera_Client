[workspace]
resolver = "3"
members = [
    "clash-bin",
    "clash-lib",
    "clash-doc",
    "clash-ffi",
    "clash-dns",
    "clash-netstack",
    "xhttp-h2-phaseb"
]


[workspace.package]
version = "0.26.2"
edition = "2024"
license = "Apache-2.0"
# homepage = "https://github.com/watfaq/clash-rs"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
strip = true
debug = 2
panic = "abort"

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docker_test)', 'cfg(throughput_test)', 'cfg(tokio_unstable)'] }

[workspace.lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
# Rust 1.99's Clippy reports double_must_use on async_trait-generated futures.
# Those futures are already #[must_use], so the generated attribute adds no
# actionable signal; keep every other warning denied.
double_must_use = "allow"
