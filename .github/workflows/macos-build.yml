name: macOS Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dashboard-dist
          path: clash-dashboard/dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [dashboard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read pinned Rust toolchain
        id: rust-version
        run: echo "version=$(bash ci/read-rust-toolchain-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dashboard-dist
          path: clash-dashboard/dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.target }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: macos-${{ matrix.target }}-${{ steps.rust-version.outputs.version }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production binary
        run: cargo build --locked --release --package clash-rs --target "${TARGET}" -F plus
        env:
          TARGET: ${{ matrix.target }}
          CLASH_GIT_REF: ${{ github.ref }}
          CLASH_GIT_SHA: ${{ github.sha }}
      - name: Package release archive
        id: package
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "clash-rs"))')"
          archive="chimera-client-${version}-${TARGET}.tar.gz"
          package_dir="${RUNNER_TEMP}/chimera-client-${version}-${TARGET}"
          mkdir -p "${package_dir}"
          install -m 0755 "target/${TARGET}/release/clash-rs" "${package_dir}/clash-rs"
          cp README.md LICENSE "${package_dir}/"
          {
            printf 'Version: %s\n' "${version}"
            printf 'Target: %s\n' "${TARGET}"
            printf 'Git ref: %s\n' "${GITHUB_REF}"
            printf 'Git SHA: %s\n' "${GITHUB_SHA}"
            printf 'Rust: %s\n' "$(rustc --version)"
          } > "${package_dir}/BUILD-INFO"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" "chimera-client-${version}-${TARGET}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chimera-client-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
