name: Windows Network Regression

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/windows-network-regression.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - clash-lib/**
      - clash-dns/**
      - clash-netstack/**
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/windows-network-regression.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - clash-lib/**
      - clash-dns/**
      - clash-netstack/**

permissions:
  contents: read

concurrency:
  group: windows-network-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-network-regression:
    name: Windows x64 - network and pool regression
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-network-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            windows-network-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: ilammy/setup-nasm@v1

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Windows Rust environment
        run: |
          rustc --version
          cargo --version
          rustc -vV
          Write-Host "Target: x86_64-pc-windows-msvc"
          Write-Host "Tests use loopback sockets and simulated network changes; no privileged TUN or NIC changes."

      # Default features compile the regular TUN code, but unit tests never
      # create a privileged Windows TUN adapter in this workflow.
      - name: Run library unit tests (default features)
        run: cargo test -p clash-lib --lib --locked -- --test-threads=1

      # These two integration tests use local TCP/UDP sockets. In particular,
      # the UDP test exercises repeated /network/reset without changing NICs.
      - name: Run UDP recovery integration tests (loopback)
        run: cargo test -p clash-lib --test direct_udp_integration_tests --locked -- --test-threads=1

      - name: Run LAN proxy integration tests (TCP)
        run: cargo test -p clash-lib --test lan_proxy_tests --locked -- --test-threads=1

      # Catch accidental feature-gating regressions in the connection-pool
      # and selector fixes without requiring QUIC, dashboard, or TUN.
      - name: Run minimal-feature pool isolation tests
        run: 'cargo test -p clash-lib --lib --no-default-features --locked app::outbound::manager::tests:: -- --test-threads=1'

      - name: Run minimal-feature proxy group path tests
        run: 'cargo test -p clash-lib --lib --no-default-features --locked proxy::group::selector::path_selection_tests:: -- --test-threads=1'

      - name: Run minimal-feature dispatcher path tests
        run: 'cargo test -p clash-lib --lib --no-default-features --locked app::dispatcher::dispatcher_impl::tests:: -- --test-threads=1'
