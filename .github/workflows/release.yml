name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.ADMIN_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Sync latest master
        run: |
          git fetch origin master
          git rebase origin/master

      - name: Verify clean checkout before version bump
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Release checkout must be clean before the version bump"
            git status --short
            exit 1
          fi

      - name: Bump version
        run: cargo set-version --bump "${{ github.event.inputs.version_type }}"

      - name: Get new version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "clash-rs") | .version')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: v$VERSION"

      - name: Commit version bump
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "::error::Version bump did not modify any tracked files"
            exit 1
          fi

          unexpected_files="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)Cargo\.toml$|^Cargo\.lock$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Version bump modified files outside Cargo manifests and Cargo.lock:"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          untracked_files="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked_files" ]]; then
            echo "::error::Version bump created unexpected untracked files:"
            printf '%s\n' "$untracked_files"
            exit 1
          fi

          # cargo set-version can update path dependencies under vendor/ as well as workspace manifests.
          git add -u -- ':(glob)**/Cargo.toml' Cargo.lock
          if git diff --cached --quiet; then
            echo "::error::No Cargo version changes were staged"
            exit 1
          fi
          if ! git diff --quiet; then
            echo "::error::Cargo version changes remain unstaged:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Release checkout is not clean after committing the version bump:"
            git status --short
            exit 1
          fi

      - name: Push release atomically
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            # The branch may have advanced while this release job was running.
            # Rebase the version bump onto the latest master before publishing.
            git fetch origin master
            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::Release checkout must be clean before rebasing:"
              git status --short
              exit 1
            fi
            git rebase origin/master
            git update-ref "refs/tags/$VERSION" HEAD

            if git push --atomic origin HEAD:master "refs/tags/$VERSION"; then
              exit 0
            fi

            git update-ref -d "refs/tags/$VERSION" || true
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to publish release after 5 attempts"
              exit 1
            fi

            sleep $((attempt * 2))
          done
