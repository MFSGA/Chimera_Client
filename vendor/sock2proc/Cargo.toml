[package]
name = "sock2proc"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-sock-diag = "0.5.0"
netlink-packet-core = "0.9.0"
netlink-sys = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_Threading", "Win32_Networking_WinSock"] }
