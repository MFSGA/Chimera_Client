[package]
name = "boring-noise"
description = "cloudflare boringtun implementation without device"
version = "0.2.1"
authors = [
    "Watfaq Devs <dev@watfaq.com>",
]
license = "BSD-3-Clause"
repository = "https://github.com/watfaq/boring-noise"
edition = "2021"

[features]
default = ["aws-lc-rs"]
# mocks std::time::Instant with mock_instant
mock-instant = ["mock_instant"]
ring = ["dep:ring", "dep:constant_time_eq"]
aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
parking_lot = "0.13"
tracing = "0.1.40"
aws-lc-rs = { version = "1", optional = true }
ring = { version = "0.17", optional = true }
constant_time_eq = { version = "0.6", optional = true }

x25519-dalek = { version = "3.0.0", features = [
    "reusable_secrets",
    "static_secrets",
] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
chacha20poly1305 = "0.11.0"
aead = "0.6.1"
blake2 = "0.11"
hmac = "0.13"
mock_instant = { version = "0.6.0", optional = true }
portable-atomic = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = [
    "time",
    "user",
] }

[dev-dependencies]
etherparse = "0.21"

[lib]
crate-type = ["rlib"]
